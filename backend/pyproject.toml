[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [".venv", "staticfiles"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "DJ", "UP"]

[tool.ruff.lint.per-file-ignores]
"*/migrations/*.py" = ["E501"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.dev"
python_files = ["test_*.py"]
